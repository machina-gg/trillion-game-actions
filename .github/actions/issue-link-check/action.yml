name: Issue Link Check
description: PR 本文に Issue 紐づけ（Closes / Fixes / Resolves / Refs + #番号）があるかを検査する。

# 判定ロジックはここに書かない（composite action の `run:` に直接書いたシェルは単体テストできない）。
# このファイルは入力を環境変数に写して check.sh を呼ぶだけを担う。

inputs:
  pr-body:
    description: PR 本文。呼び出し側が github.event.pull_request.body を渡す。
    required: true
  labels-json:
    description: >-
      PR のラベル名の JSON 配列。呼び出し側が
      toJSON(github.event.pull_request.labels.*.name) を渡す。
      ⚠ カンマ連結した文字列ではなく JSON 配列を渡すこと（要素の完全一致で判定するため）。
    required: true
  override-label:
    description: 検査をスキップするラベル名。この名前と完全一致する要素がラベルにあるときだけスキップする。
    required: false
    default: "override:no-issue"

runs:
  using: composite
  steps:
    - name: Issue Link Check
      shell: bash
      env:
        PR_BODY: ${{ inputs.pr-body }}
        LABELS_JSON: ${{ inputs.labels-json }}
        OVERRIDE_LABEL: ${{ inputs.override-label }}
      run: bash "${{ github.action_path }}/check.sh"
