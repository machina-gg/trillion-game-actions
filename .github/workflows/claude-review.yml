name: Claude Review

# trillion-game-actions 自身の PR を、このリポジトリが提供する reusable workflow でレビューする。
# ⚠ ローカル参照（./.github/workflows/review.yml）なので、走るのは PR 側の review.yml の定義。
#   一方で観点と Approve スクリプト（.trillion-game-actions/）は review.yml が main から checkout するため、
#   PR で観点を書き換えても、その PR 自身のレビューには反映されない（自己 Approve 対策）。
# ⚠ secret（CLAUDE_CODE_OAUTH_TOKEN）が未登録のリポジトリでは review.yml 側が warning で skip し、
#   job は成功で終わる（レビューコメントと Approve は付かない）。

on:
  pull_request:
    # ⚠ labeled / unlabeled / edited は含めない（ラベル操作による再トリガーで Claude を再走させない）。
    # synchronize で push ごとに再走する = dismiss stale 後の再 Approve。
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# 同一 PR の run を 1 本に保つ。
# ⚠ github.workflow を含めないと他のワークフローと group が衝突し、互いにキャンセルし合う。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 既定は最小権限。書き込みは review ジョブだけに与える。
permissions:
  contents: read

jobs:
  review:
    uses: ./.github/workflows/review.yml
    # ⚠ 呼び出し元がここで与えた権限以下しか、呼ばれる側は宣言できない
    #   （README.md「呼び出し元に必要な permissions」）。
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      profile: harness
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
