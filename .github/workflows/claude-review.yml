name: Claude Review

# trillion-game-actions 自身の PR を、このリポジトリが提供する reusable workflow でレビューする。
# ローカル参照なので走るのは PR 側の review.yml の定義だが、観点と Approve スクリプトは review.yml が
# main から checkout するため、PR で観点を書き換えてもその PR 自身のレビューには効かない（自己 Approve 対策）。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# ⚠ group に github.workflow を含める（外すと他のワークフローと衝突して互いにキャンセルし合う）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    uses: ./.github/workflows/review.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      profile: harness
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
