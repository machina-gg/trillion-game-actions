name: Agent Review

# 呼び出し元リポジトリの Pull Request を GitHub Actions 上の Claude がレビューし、
# 判定行が `判定: APPROVE` のときだけ GITHUB_TOKEN（github-actions[bot]）で Approve を押す
# reusable workflow。呼び方・呼び出し元に必要な permissions・プロファイル一覧は README.md を参照。
#
# なぜ要るか: PR 作成者・レビュー実行者が同一 GitHub アカウントで動く運用では、そのアカウントは
# 正式な Approve を出せない（GitHub は PR 作成者自身の Approve を受け付けない）。GITHUB_TOKEN の
# Approve はブランチルールセットの必須 Approve に数えられるため、別身元の Approve をここで作る。
#
# 呼び出し元のワークスペース内の `.trillion-game-actions/` は、このリポジトリを checkout する先
# （パス名はリポジトリ名に合わせてある）。
#
# ⚠ 2 段構え。Claude は `gh pr comment` で講評を投稿するだけで Approve は押せない
#   （`gh api` / `gh pr review` / inline コメント MCP を許可しない）。Approve を押すのは
#   .trillion-game-actions/scripts/approve-if-verdict.sh で、判定行の形式・投稿者・時刻・head SHA を
#   機械で検査してから実行する（判定順はスクリプト冒頭のコメント）。
# ⚠ Approve しない経路（REQUEST_CHANGES / 判定行なし / head が動いた / secret 未設定 /
#   claude-code-action 自体の失敗）でも job は成功で終える。job を失敗させると、Approve が
#   付かないことに加えて「CI が赤い」という別の理由でも PR が止まり、原因が二重になる。
#   Approve が付かなければ呼び出し元のルールセットが止める。
#   ⚠ 唯一 job を失敗させるのは (a) profile の値が不正、(b) .trillion-game-actions/ の改変検出、
#   (c) approve-if-verdict.sh の UNDETERMINED（API 失敗・解釈不能）の 3 つで、
#   いずれも「Approve を押せない異常」を run の失敗で見せるためのもの（fail-close）。
# ⚠ 呼び出し元の PR が自分の workflow 定義を変えて自己 Approve できる構造は塞いでいない
#   （pull_request は PR 側の定義を実行するため）。`.yml` を人間マージにする運用で守る。

on:
  workflow_call:
    inputs:
      profile:
        description: >-
          読ませる観点プロファイル名。perspectives/<name>.md に対応する。カンマ区切りで複数指定できる。
          省略時は perspectives/common.md だけを読む。使える名前は README.md の一覧を参照。
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code の OAuth トークン（`claude setup-token` で発行し、呼び出し元リポジトリの secret に登録する）
        required: true

jobs:
  review:
    # draft と、github-actions[bot] 自身が作った PR は対象外（自分の投稿を自分でレビューしない）。
    # ⚠ 呼び出し元は `on: pull_request` であることが前提（README.md「呼び方」）。
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    # ⚠ ここで宣言できるのは呼び出し元の GITHUB_TOKEN 権限以下だけ（公式ドキュメント:
    #   https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
    #   「permissions can only be maintained or reduced—not elevated—throughout the chain」）。
    #   呼び出し元の job にも同じ 3 つを与えること（README.md「呼び出し元に必要な permissions」）。
    permissions:
      contents: read
      # Approve（reviews API）に pull-requests: write、`gh pr comment` に issues: write が要る
      pull-requests: write
      issues: write
    steps:
      # 呼び出し元リポジトリ（レビュー対象）。fetch-depth: 0 は差分・履歴を読ませるため。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 観点と Approve スクリプトの実体。public リポジトリなので token を渡さずに取れる。
      # ⚠ ref は main 固定。呼び出し元の PR が観点や Approve スクリプトを差し替える経路を作らない
      #   （trillion-game-actions 自身の PR をレビューするときも、観点は main のものが使われる）。
      - name: Checkout trillion-game-actions
        uses: actions/checkout@v7
        with:
          repository: machina-gg/trillion-game-actions
          ref: main
          path: .trillion-game-actions
          # public リポジトリの読み取り専用 checkout で以後の git 操作も無いため、
          # GITHUB_TOKEN を .trillion-game-actions/.git/config に残さない
          persist-credentials: false

      # profile の値をシェルにも prompt にも素通しさせない。カンマで分割し、ファイル名として
      # 安全な文字集合だけを通す（外れたら run を失敗させる = fail-close）。
      # ⚠ 不正な値そのものはログに出さない（ログへの制御シーケンス混入を避ける）。
      - name: Validate profile input
        id: profile
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          INPUT="${PROFILE_INPUT//[[:space:]]/}"
          PROMPT_LIST=""
          IFS=',' read -r -a PROFILE_NAMES <<< "$INPUT"
          for NAME in "${PROFILE_NAMES[@]}"; do
            if [ -z "$NAME" ]; then
              continue
            fi
            if [[ ! "$NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error title=Agent Review::profile の値が不正です。使えるのは英数字・ハイフン・アンダースコアと、区切りのカンマだけです（利用できるプロファイルの一覧は machina-gg/trillion-game-actions の README.md）"
              exit 1
            fi
            PROMPT_LIST="${PROMPT_LIST:+${PROMPT_LIST}, }.agent-review/perspectives/${NAME}.md"
          done
          if [ -z "$PROMPT_LIST" ]; then
            PROMPT_LIST="なし（common.md だけを読む）"
          fi
          echo "prompt_list=${PROMPT_LIST}" >> "$GITHUB_OUTPUT"
          echo "=== 追加プロファイル: ${PROMPT_LIST} ==="

      # job 開始時刻（判定行を探す下限）と secret の有無を後続ステップへ渡す。
      # ⚠ GitHub Actions の仕様上 `if:` で secrets を直接参照できないため、env に写して判定する。
      #   secret が無いだけで呼び出し元の PR が「CI 赤」になるのを防ぐため、無いときは skip して
      #   job は成功で終える。
      - name: Record start time and check secret
        id: prep
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"
          echo "=== job 開始時刻（判定行の検索下限）: ${SINCE} ==="
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Agent Review::secret 未設定: CLAUDE_CODE_OAUTH_TOKEN が空のため、Claude のレビューと Approve を skip します（job は成功で終えます。登録はリポジトリ管理者の作業: claude setup-token で発行し repo secret に登録する）"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # prompt を渡さないとアクションは「@claude メンション応答」モードになり何もせず終わる。
      # github_token を渡すので投稿身元は github-actions[bot]。
      # ⚠ prompt に観点・判定基準・フォーマットを再掲しない（SSOT は perspectives/）。
      #   ここに書くのは「この実行環境での読み替え」だけ。
      # ⚠ continue-on-error: Claude の一過性の失敗（API 障害・レート制限等）で job を失敗させない。
      #   失敗すればレビューコメントが無く Approve も付かないので、止めるのはルールセット側。
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.prep.outputs.has_token == 'true'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この Pull Request をレビューしてください。観点・判定基準・結果フォーマットの SSOT は
            次のファイルです（ワークスペースにチェックアウト済み）。

            - .agent-review/perspectives/common.md （全リポジトリ共通。必ず読む）
            - 追加プロファイル: ${{ steps.profile.outputs.prompt_list }}
            - リポジトリ直下の CLAUDE.md （存在すれば読む。無ければ飛ばす）

            指定された追加プロファイルのファイルが存在しない場合は、そのファイルを無視して
            レビューを続け、`未解決:` に「指定されたプロファイルが見つからない」と書いてください
            （利用できるプロファイルの一覧は .trillion-game-actions/README.md にあります）。

            この実行環境（GitHub Actions・GITHUB_TOKEN）での読み替え:
            - 差分は `gh pr diff`、PR 情報は `gh pr view --json`、関連 Issue（PR 本文の Closes #N）は
              `gh issue view` で読む。`gh api` は許可していないので、観点が `gh api` で行う手順
              （変更パスの取得・Issue 突き合わせ・base の鮮度確認）は上の代替に読み替える。
              `gh issue view` が 403 で失敗したら Issue 本文の参照を諦め、その旨をレビュー本文に書く。
            - ローカル専用の手順（実行環境の鮮度確認・CI 合否の確認スクリプト）は行わない。
              絶対パスを持つローカルのスクリプトはこの runner に無い。CI の合否はルールセットの
              必須チェックが担うので、判定基準の「CI 全パス」はここでは判定に含めない。
            - 結果は `gh pr comment` で 1 件だけ投稿する（定型フォーマットの `判定:` 行は後続ステップが
              機械で読む）。複数行の本文は `mktemp -d` が返した一時ディレクトリ配下に Write で作り、
              `gh pr comment <PR番号> --body-file <絶対パス>` で投稿する
              （複数行の本文を判定行付きで確実に投稿するための標準の経路）。
              inline コメントは使わない。指摘のためだけの指摘はしない。
              レビュー内容は必ず GitHub のコメントとして投稿し、メッセージとして出力するだけで終わらせない。
          # ⚠ 許可しないもの（設計上の必須事項）:
          #   - Bash(gh api:*) / Bash(gh pr review:*): Claude 自身が Approve を押せる形になる
          #   - mcp__github_inline_comment__create_inline_comment: review thread を作り、
          #     未解決スレッドとしてマージを止める
          #   --allowedTools は既定のツールに足す形なので、上の 3 つは --disallowedTools でも明示的に落とす。
          # Write と Bash(mktemp:*) を許可する理由: 複数行の本文を判定行付きで確実に投稿するため、
          #   Write + --body-file を標準の経路にしている（Write 無しでは判定行が 1 行に圧縮され
          #   approve-if-verdict.sh の抽出条件に当たらない）。Edit は不要（成果物を修正させない）。
          claude_args: |
            --allowedTools "Read,Glob,Grep,Write,Bash(mktemp:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh api:*),Bash(gh pr review:*)"

      - name: Warn if Claude failed
        if: steps.prep.outputs.has_token == 'true' && steps.claude.outcome != 'success'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: echo "::warning title=Agent Review::claude-code-action が ${CLAUDE_OUTCOME} で終わったため Approve のステップを skip します（レビューコメントが無ければ Approve は付かず、ルールセットが止めます。原因は上のステップのログ）"

      # 判定行が APPROVE のときだけ Approve を押す。Approve しない理由が確定した場合も exit 0。
      # 判定は標準出力の最後の行のラベルで読む（スクリプト冒頭のコメント）。
      # ⚠ Claude には Write を許しているため、Approve を押すスクリプトと観点を実行前に書き換えられる。
      #   checkout 時点から変わっていたら Approve を押さずに run を失敗させる（fail-close）。
      #   `git diff` は追跡ファイルの変更しか見ないため、`status --porcelain` で未追跡ファイルの
      #   追加も検知対象にする（`--untracked-files=all` で新規ディレクトリの中身も列挙する）。
      - name: Approve if verdict is APPROVE
        if: steps.prep.outputs.has_token == 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.prep.outputs.since }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAMPER_STATUS="$(git -C .trillion-game-actions status --porcelain --untracked-files=all)"
          if [ -n "$TAMPER_STATUS" ]; then
            echo "::error title=Agent Review::.trillion-game-actions/ が checkout 時点から変更されています（Claude の実行後・追跡ファイルの変更または未追跡ファイルの追加）。Approve を押さずに止めます"
            echo "$TAMPER_STATUS"
            exit 1
          fi
          echo "=== .trillion-game-actions/ は checkout 時点から変更なし（追跡ファイルの変更・未追跡ファイルの追加とも無し） ==="
          bash .trillion-game-actions/scripts/approve-if-verdict.sh "$PR_NUMBER" "$SINCE" "$HEAD_SHA"
